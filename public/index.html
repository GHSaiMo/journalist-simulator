<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>&#8203;</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    button svg { pointer-events: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden;
      background: #0d0908;
      user-select: none; -webkit-user-select: none;
      touch-action: none;
      font-family: ui-monospace, "SF Mono", Menlo, Monaco, monospace;
      color: #f2ece1;
    }

    #viewport {
      position: fixed; inset: 0; width: 100%; height: 100%;
      outline: none; cursor: crosshair;
    }

    /* Silent Loading Spinner */
    #loader-ring {
      position: fixed; left: 50%; top: 50%;
      width: 40px; height: 40px; margin: -20px 0 0 -20px;
      border-radius: 50%;
      border: 2px solid rgba(220, 180, 100, 0.18);
      border-top-color: rgba(232, 190, 108, 0.9);
      animation: spin 0.8s linear infinite;
      z-index: 90; pointer-events: none;
      transition: opacity 0.35s ease;
    }
    #loader-ring.done { opacity: 0; }
    @keyframes spin { to { transform: rotate(360deg); } }

    .hidden { display: none !important; }

    /* =========================================================
       SLR Optical Viewfinder (OVF) Mask & Green LED Bar (Zero Text)
       ========================================================= */
    #ovf-overlay {
      position: fixed; inset: 0; pointer-events: none; z-index: 20;
      opacity: 0; transition: opacity 0.11s ease-out;
      display: flex; align-items: center; justify-content: center;
    }
    #ovf-overlay.active { opacity: 1; }

    .ovf-matte {
      position: relative;
      width: min(88vw, calc(82vh * 1.5));
      height: min(82vh, calc(88vw / 1.5));
      border-radius: 18px;
      box-shadow:
        0 0 0 9999px rgba(6, 5, 5, 0.94),
        inset 0 0 55px rgba(0, 0, 0, 0.68);
      border: 1.5px solid rgba(255, 255, 255, 0.12);
    }

    /* Corner AF Frame Brackets */
    .ovf-corner {
      position: absolute; width: 26px; height: 26px;
      border-color: rgba(255, 255, 255, 0.42); border-style: solid;
    }
    .ovf-tl { top: 14%; left: 16%; border-width: 1.5px 0 0 1.5px; }
    .ovf-tr { top: 14%; right: 16%; border-width: 1.5px 1.5px 0 0; }
    .ovf-bl { bottom: 16%; left: 16%; border-width: 0 0 1.5px 1.5px; }
    .ovf-br { bottom: 16%; right: 16%; border-width: 0 1.5px 1.5px 0; }

    /* Center Split-Prism Micro-Collar & Focus Point */
    .ovf-prism {
      position: absolute; left: 50%; top: 49%; transform: translate(-50%, -50%);
      width: 68px; height: 68px; border-radius: 50%;
      border: 1px solid rgba(255, 255, 255, 0.36);
      display: flex; align-items: center; justify-content: center;
    }
    .ovf-prism::before {
      content: ""; width: 32px; height: 32px; border-radius: 50%;
      border: 1px dashed rgba(255, 255, 255, 0.30);
    }
    .ovf-prism::after {
      content: ""; position: absolute; width: 14px; height: 1px;
      background: rgba(255, 255, 255, 0.35);
    }
    .ovf-af-box {
      position: absolute; width: 16px; height: 12px;
      border: 1.5px solid rgba(255, 90, 70, 0.65);
      transition: border-color 0.12s ease, box-shadow 0.12s ease;
    }
    .ovf-af-box.locked {
      border-color: rgba(110, 255, 130, 0.85);
      box-shadow: 0 0 8px rgba(110, 255, 130, 0.45);
    }

    /* Classic Green Optical SLR Bottom Readout Strip (Numbers & Symbols Only) */
    .ovf-led-bar {
      position: absolute; bottom: -30px; left: 50%; transform: translateX(-50%);
      display: flex; align-items: center; gap: 18px;
      color: #6bf282; font-size: 13px; font-weight: 600; letter-spacing: 0.8px;
      text-shadow: 0 0 8px rgba(107, 242, 130, 0.55);
      white-space: nowrap;
    }
    .ovf-meter { display: inline-flex; align-items: center; gap: 3px; opacity: 0.88; }
    .ovf-tick { width: 2px; height: 6px; background: #6bf282; display: inline-block; }
    .ovf-tick.mid { height: 10px; width: 2.5px; }
    .ovf-af-dot {
      width: 9px; height: 9px; border-radius: 50%;
      background: #6bf282; box-shadow: 0 0 8px #6bf282;
    }

    /* SLR 55ms Mirror Blackout & Flash Whiteout */
    #mirror-blackout {
      position: fixed; inset: 0; background: #000;
      opacity: 0; pointer-events: none; z-index: 28;
    }
    #flash-screen-pulse {
      position: fixed; inset: 0; background: #f5f9ff;
      opacity: 0; pointer-events: none; z-index: 27;
      transition: opacity 0.18s ease-out;
    }

    /* Subtle Center Hip Crosshair Dot & Nearby Seat Prompt Icon */
    #hip-reticle {
      position: fixed; left: 50%; top: 50%; width: 5px; height: 5px;
      margin: -2.5px 0 0 -2.5px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 4px rgba(0, 0, 0, 0.65);
      pointer-events: none; z-index: 15;
    }

    #seat-hint-icon {
      position: fixed; left: 50%; bottom: 20%; transform: translateX(-50%);
      height: 42px; min-width: 42px; padding: 0 14px; border-radius: 999px;
      background: rgba(20, 15, 13, 0.78);
      backdrop-filter: blur(8px);
      border: 1.5px solid rgba(232, 190, 102, 0.85);
      display: flex; align-items: center; justify-content: center; gap: 8px;
      color: #f7d98c; pointer-events: auto; cursor: pointer; z-index: 24;
      font-family: ui-monospace, "SF Mono", "PingFang SC", sans-serif;
      font-size: 12.5px; letter-spacing: 1px;
      animation: pulseSeat 1.5s ease-in-out infinite;
    }
    body.mobile-mode #seat-hint-label { display: none; }
    body.mobile-mode #seat-hint-icon { width: 44px; padding: 0; border-radius: 50%; }
    @keyframes pulseSeat {
      0%, 100% { transform: translateX(-50%) scale(1); }
      50% { transform: translateX(-50%) scale(1.09); }
    }

    /* =========================================================
       Top-Right Pure-Icon Bar (Album, Flash, Sound, Touch Mode)
       ========================================================= */
    .top-icon-bar {
      position: fixed; top: max(14px, env(safe-area-inset-top)); right: max(14px, env(safe-area-inset-right));
      display: flex; align-items: center; gap: 10px; z-index: 35;
    }
    .icon-pill {
      position: relative;
      width: 44px; height: 44px; border-radius: 12px;
      background: rgba(20, 15, 13, 0.62);
      backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.18);
      color: rgba(248, 242, 230, 0.9);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer; transition: transform 0.14s ease, border-color 0.14s ease, background 0.14s ease;
    }
    .icon-pill:hover { border-color: rgba(232, 190, 102, 0.7); }
    .icon-pill:active { transform: scale(0.93); }
    .icon-pill.active-gold {
      border-color: rgba(236, 194, 98, 0.85);
      color: #ffd97d;
      background: rgba(48, 34, 16, 0.68);
    }

    #album-thumb-preview {
      position: absolute; inset: 3px; border-radius: 9px;
      background-size: cover; background-position: center;
      opacity: 0; transition: opacity 0.2s ease; pointer-events: none;
    }
    #album-thumb-preview.has-photo { opacity: 0.42; }

    #album-count {
      position: absolute; top: -5px; right: -5px;
      min-width: 19px; height: 19px; padding: 0 5px;
      border-radius: 999px; background: #d69e3a; color: #160f0b;
      font-size: 11px; font-weight: 700;
      display: none; align-items: center; justify-content: center;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.5);
    }

    /* Flying Polaroid Animation on Capture */
    #photo-fly-layer { position: fixed; inset: 0; pointer-events: none; z-index: 34; }
    .flying-polaroid {
      position: fixed; left: 50%; top: 50%;
      width: 180px; height: 120px; margin: -60px 0 0 -90px;
      border: 5px solid #faf7f0; border-radius: 4px;
      background-size: cover; background-position: center;
      box-shadow: 0 12px 32px rgba(0, 0, 0, 0.65);
      transition: transform 0.62s cubic-bezier(0.22, 1, 0.36, 1), opacity 0.62s ease;
    }
    .flying-polaroid.fly-to-corner {
      transform: translate(calc(50vw - 42px), calc(-50vh + 36px)) scale(0.18) rotate(8deg);
      opacity: 0.15;
    }

    /* =========================================================
       Mobile Translucent Touch Controls (Zero Text)
       ========================================================= */
    #touch-controls {
      position: fixed; inset: 0; pointer-events: none; z-index: 30;
    }

    /* Left Translucent Virtual Movement Pad */
    #touch-joystick-zone {
      position: absolute;
      left: max(22px, env(safe-area-inset-left));
      bottom: max(24px, env(safe-area-inset-bottom));
      width: 132px; height: 132px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(255,255,255,0.08) 0%, rgba(255,255,255,0.03) 70%);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      backdrop-filter: blur(4px); -webkit-backdrop-filter: blur(4px);
      pointer-events: auto;
      display: flex; align-items: center; justify-content: center;
    }
    #touch-joystick-knob {
      width: 52px; height: 52px; border-radius: 50%;
      background: rgba(255, 250, 240, 0.32);
      border: 1.5px solid rgba(255, 255, 255, 0.55);
      box-shadow: 0 4px 14px rgba(0, 0, 0, 0.35);
      pointer-events: none;
      transform: translate(0px, 0px);
    }

    /* Right Translucent Camera Action Pad */
    .touch-right-cluster {
      position: absolute;
      right: max(22px, env(safe-area-inset-right));
      bottom: max(24px, env(safe-area-inset-bottom));
      display: flex; align-items: flex-end; gap: 14px;
      pointer-events: none;
    }

    /* Vertical Optical Zoom & Aperture Sliders */
    #touch-zoom-track, #touch-aperture-track {
      pointer-events: auto;
      width: 38px; height: 148px; border-radius: 999px;
      background: rgba(20, 16, 14, 0.45);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1px solid rgba(255, 255, 255, 0.22);
      position: relative;
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      padding: 10px 0; color: rgba(255, 255, 255, 0.68); font-size: 13px; font-weight: 700;
    }
    #touch-zoom-thumb, #touch-aperture-thumb {
      position: absolute; left: 4px; width: 28px; height: 28px; border-radius: 50%;
      background: rgba(236, 194, 98, 0.85);
      border: 1.5px solid #fff;
      top: 96px; pointer-events: none;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.45);
    }
    #touch-aperture-thumb {
      background: rgba(110, 242, 138, 0.85);
    }
    #btn-cycle-aperture {
      width: auto; padding: 0 11px; gap: 6px; font-size: 12px; font-weight: 700;
    }

    .touch-action-col {
      display: flex; flex-direction: column; align-items: center; gap: 12px;
      pointer-events: auto;
    }

    .touch-btn {
      border-radius: 50%;
      background: rgba(24, 18, 16, 0.48);
      backdrop-filter: blur(6px); -webkit-backdrop-filter: blur(6px);
      border: 1.5px solid rgba(255, 255, 255, 0.30);
      color: rgba(255, 250, 242, 0.92);
      display: flex; align-items: center; justify-content: center;
      cursor: pointer;
    }
    .touch-btn:active { transform: scale(0.92); }
    .touch-btn.active {
      background: rgba(214, 162, 66, 0.55);
      border-color: rgba(255, 232, 168, 0.95);
      color: #fff;
    }

    #btn-touch-aim { width: 52px; height: 52px; }
    #btn-touch-crouch { width: 46px; height: 46px; }
    #btn-touch-shutter {
      width: 72px; height: 72px;
      background: rgba(255, 255, 255, 0.20);
      border: 3px solid rgba(255, 255, 255, 0.85);
      position: relative;
    }
    #btn-touch-shutter::after {
      content: ""; width: 54px; height: 54px; border-radius: 50%;
      background: rgba(255, 250, 242, 0.82);
      transition: transform 0.1s ease;
    }
    #btn-touch-shutter:active::after { transform: scale(0.86); background: #ffd97d; }

    /* =========================================================
       Pure-Icon Photo Album & Lightbox Modal (Zero Text)
       ========================================================= */
    #album-modal {
      position: fixed; inset: 0; z-index: 60;
      background: rgba(12, 9, 8, 0.88);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
      display: flex; flex-direction: column;
      padding: max(18px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    }
    .album-topbar {
      display: flex; justify-content: space-between; align-items: center;
      padding-bottom: 14px; border-bottom: 1px solid rgba(255, 255, 255, 0.10);
    }
    .album-brand-icon { color: rgba(232, 190, 102, 0.85); display: flex; align-items: center; gap: 10px; }

    #album-grid {
      flex: 1; overflow-y: auto; padding: 18px 2px;
      display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px; align-content: start;
    }
    .album-cell {
      background: #1b1513; border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px; padding: 7px 7px 6px; cursor: pointer;
      transition: transform 0.16s ease, border-color 0.16s ease;
      display: flex; flex-direction: column; gap: 6px;
    }
    .album-cell:hover { transform: translateY(-2px); border-color: rgba(232, 190, 102, 0.75); }
    .album-cell-img {
      width: 100%; aspect-ratio: 3 / 2; border-radius: 4px;
      background-size: cover; background-position: center; background-color: #0e0b0a;
    }
    .album-cell-meta {
      display: flex; justify-content: space-between;
      font-size: 11px; color: rgba(235, 224, 205, 0.55); padding: 0 2px;
    }

    #album-empty-icon {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      color: rgba(255, 255, 255, 0.18); pointer-events: none;
    }

    /* Full-Screen Lightbox */
    #album-lightbox {
      position: fixed; inset: 0; z-index: 70;
      background: rgba(8, 6, 6, 0.96);
      display: flex; flex-direction: column; justify-content: space-between; align-items: center;
      padding: max(16px, env(safe-area-inset-top)) 16px max(20px, env(safe-area-inset-bottom));
    }
    .lightbox-top {
      width: 100%; display: flex; justify-content: space-between; align-items: center;
    }
    #lightbox-exif { font-size: 12px; color: rgba(110, 242, 130, 0.8); letter-spacing: 1px; }

    .lightbox-stage {
      position: relative; flex: 1; width: 100%;
      display: flex; align-items: center; justify-content: center;
      min-height: 0; padding: 12px 0;
    }
    #lightbox-img {
      max-width: min(92vw, 1180px); max-height: 72vh;
      border: 6px solid #f7f4ec; border-radius: 3px;
      box-shadow: 0 18px 50px rgba(0, 0, 0, 0.75);
      object-fit: contain;
    }
    .nav-arrow {
      position: absolute; top: 50%; transform: translateY(-50%);
      width: 46px; height: 46px; border-radius: 50%;
      background: rgba(255, 255, 255, 0.10); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff; display: flex; align-items: center; justify-content: center; cursor: pointer;
    }
    .nav-arrow:hover { background: rgba(232, 190, 102, 0.35); }
    #btn-prev-photo { left: 12px; }
    #btn-next-photo { right: 12px; }

    .lightbox-actions {
      display: flex; gap: 14px; align-items: center;
    }
    .icon-pill.action-ok {
      border-color: #6bf282 !important; color: #6bf282 !important;
      background: rgba(30, 75, 40, 0.65) !important;
    }
    .icon-pill.danger:hover { border-color: #ff6b6b; color: #ff6b6b; }

    /* =========================================================
       Desktop vs Mobile Clean Mode Separation + Retro Field Manual
       ========================================================= */
    body.desktop-mode .top-icon-bar,
    body.desktop-mode #touch-controls {
      display: none !important;
    }
    body.mobile-mode #btn-toggle-touch {
      display: none !important;
    }
    body.desktop-mode.fps-active,
    body.desktop-mode.fps-active #viewport,
    body.desktop-mode.fps-active canvas {
      cursor: none !important;
    }

    #desktop-guide {
      position: fixed;
      inset: 0;
      z-index: 52;
      display: flex;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(16, 12, 10, 0.36) 0%, rgba(10, 8, 7, 0.68) 100%);
      backdrop-filter: blur(3.5px);
      -webkit-backdrop-filter: blur(3.5px);
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.65s ease, backdrop-filter 0.65s ease;
    }
    #desktop-guide.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
      backdrop-filter: blur(0px);
      -webkit-backdrop-filter: blur(0px);
    }
    body.intro-playing .top-icon-bar,
    body.intro-playing #touch-controls,
    body.intro-playing #hip-reticle,
    body.intro-playing #seat-hint-icon {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    #mobile-entry-gate {
      position: fixed;
      inset: 0;
      z-index: 52;
      display: flex;
      align-items: flex-end;
      justify-content: center;
      padding-bottom: 18vh;
      background: radial-gradient(circle at center, rgba(16, 12, 10, 0.18) 0%, rgba(10, 8, 7, 0.56) 100%);
      cursor: pointer;
      opacity: 1;
      transition: opacity 0.65s ease;
    }
    #mobile-entry-gate.hidden {
      opacity: 0 !important;
      pointer-events: none !important;
    }
    .mobile-entry-pill {
      padding: 10px 24px;
      border-radius: 999px;
      background: rgba(22, 17, 14, 0.82);
      border: 1px solid rgba(226, 190, 120, 0.42);
      color: #e8c985;
      font-family: "Songti SC", "STSong", Georgia, serif;
      font-size: 14px;
      letter-spacing: 3px;
      animation: guidePulse 2.4s ease-in-out infinite;
    }
    .guide-card {
      width: min(500px, 90vw);
      padding: 28px 34px 24px;
      border-radius: 6px;
      background: rgba(22, 17, 14, 0.86);
      border: 1px solid rgba(224, 188, 120, 0.34);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.72), inset 0 0 0 1px rgba(255, 245, 224, 0.05);
      color: #ede4d3;
      font-family: "Songti SC", "STSong", "Noto Serif SC", Georgia, serif;
    }
    .guide-header {
      text-align: center;
      font-size: 15px;
      letter-spacing: 5px;
      color: #e2be78;
      padding-bottom: 16px;
      margin-bottom: 18px;
      border-bottom: 1px solid rgba(226, 190, 120, 0.18);
    }
    .guide-rows {
      display: flex;
      flex-direction: column;
      gap: 11px;
      font-size: 13.5px;
      line-height: 1.5;
    }
    .guide-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
    }
    .guide-keys {
      display: flex;
      align-items: center;
      gap: 6px;
      flex-shrink: 0;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      color: #f6e7c4;
    }
    .kbd {
      display: inline-block;
      padding: 2px 8px;
      border-radius: 4px;
      background: rgba(255, 244, 220, 0.09);
      border: 1px solid rgba(232, 196, 128, 0.36);
      box-shadow: 0 1px 0 rgba(0, 0, 0, 0.5);
    }
    .guide-desc {
      color: rgba(237, 228, 211, 0.84);
      text-align: right;
    }
    .guide-subbar {
      margin-top: 16px;
      padding-top: 13px;
      border-top: 1px dashed rgba(226, 190, 120, 0.18);
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 14px;
      font-size: 12px;
      color: rgba(224, 212, 192, 0.66);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", sans-serif;
    }
    .guide-subbar b {
      color: #e6c687;
      font-weight: 600;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
    }
    .guide-enter {
      margin-top: 18px;
      text-align: center;
      font-size: 12.5px;
      letter-spacing: 2.5px;
      color: #e6c37a;
      animation: guidePulse 2.4s ease-in-out infinite;
    }
    @keyframes guidePulse {
      0%, 100% { opacity: 0.55; }
      50% { opacity: 1; }
    }

    #desktop-toast {
      position: fixed;
      left: 50%;
      bottom: 30px;
      transform: translateX(-50%);
      z-index: 36;
      padding: 5px 14px;
      border-radius: 999px;
      background: rgba(18, 14, 12, 0.72);
      border: 1px solid rgba(226, 190, 120, 0.32);
      color: #f0dfb8;
      font-family: ui-monospace, "SF Mono", Menlo, monospace;
      font-size: 12px;
      letter-spacing: 1.2px;
      pointer-events: none;
      opacity: 0;
      transition: opacity 0.22s ease;
    }
    #desktop-toast.show { opacity: 1; }
  </style>
</head>
<body>
  <div id="viewport" tabindex="0"></div>
  <div id="loader-ring"></div>
  <div id="hip-reticle"></div>
  <div id="mirror-blackout"></div>
  <div id="flash-screen-pulse"></div>
  <div id="photo-fly-layer"></div>
  <div id="desktop-toast"></div>

  <!-- Desktop Opening Field Manual (Nostalgic Press Card) -->
  <div id="desktop-guide" class="hidden">
    <div class="guide-card">
      <div class="guide-header">现场操作手记</div>
      <div class="guide-rows">
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">W</span><span class="kbd">A</span><span class="kbd">S</span><span class="kbd">D</span></div>
          <div class="guide-desc">在厅内走动（按住 Shift 快步）</div>
        </div>
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">移动鼠标</span></div>
          <div class="guide-desc">环顾四周 · 控制人物朝向</div>
        </div>
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">按住右键</span></div>
          <div class="guide-desc">将眼睛凑近单反光学取景器</div>
        </div>
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">鼠标左键</span></div>
          <div class="guide-desc">按下快门拍照（松开右键可胸前盲拍）</div>
        </div>
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">鼠标滚轮</span></div>
          <div class="guide-desc">推拉变焦环（24 – 135mm）</div>
        </div>
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">Q</span> / <span class="kbd">E</span></div>
          <div class="guide-desc">拨动光圈景深（f/1.4 虚化 – f/16 全清晰）</div>
        </div>
        <div class="guide-row">
          <div class="guide-keys"><span class="kbd">C</span></div>
          <div class="guide-desc">蹲身低机位 · 走近空扶手椅落座</div>
        </div>
      </div>
      <div class="guide-subbar">
        <span><b>F</b> 机顶闪光灯</span>
        <span><b>G</b> 暗房相册</span>
        <span><b>M</b> 声音开关</span>
        <span><b>H / Esc</b> 呼出本页</span>
      </div>
      <div class="guide-enter">点击画面任意处 · 推门步入现场</div>
    </div>
  </div>

  <!-- Mobile Opening Tap Gate (starts the walk-in door animation on touch) -->
  <div id="mobile-entry-gate" class="hidden">
    <div class="mobile-entry-pill">轻触画面 · 推门步入现场</div>
  </div>

  <!-- Optical SLR Viewfinder (OVF) Overlay - Pure Symbols & Camera Numbers Only -->
  <div id="ovf-overlay">
    <div class="ovf-matte">
      <div class="ovf-corner ovf-tl"></div>
      <div class="ovf-corner ovf-tr"></div>
      <div class="ovf-corner ovf-bl"></div>
      <div class="ovf-corner ovf-br"></div>
      <div class="ovf-prism">
        <div id="ovf-af-box" class="ovf-af-box locked"></div>
      </div>
      <div class="ovf-led-bar">
        <span id="ovf-shutter">125</span>
        <span id="ovf-aperture">2.8</span>
        <div class="ovf-meter">
          <span class="ovf-tick"></span><span class="ovf-tick"></span><span class="ovf-tick"></span>
          <span class="ovf-tick mid"></span>
          <span class="ovf-tick"></span><span class="ovf-tick"></span><span class="ovf-tick"></span>
        </div>
        <span id="ovf-focal">50</span>
        <span id="ovf-dist">2.8</span>
        <span id="ovf-flash-led">⚡</span>
        <span id="ovf-af-dot" class="ovf-af-dot"></span>
      </div>
    </div>
  </div>

  <!-- Nearby Empty Armchair Sit Prompt -->
  <button id="seat-hint-icon" class="hidden" aria-label="sit">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M7 13v-6a3 3 0 0 1 3-3h4a3 3 0 0 1 3 3v6"/>
      <path d="M5 10a2 2 0 0 1 2 2v3h10v-3a2 2 0 0 1 4 0v5H3v-5a2 2 0 0 1 2-2z"/>
      <path d="M6 17v3M18 17v3"/>
    </svg>
    <span id="seat-hint-label">[C] 落座</span>
  </button>

  <!-- Top-Right Pure-Icon Bar -->
  <div class="top-icon-bar">
    <!-- Toggle Translucent Touch Controls (useful on hybrid/tablet or testing on PC) -->
    <button id="btn-toggle-touch" class="icon-pill" aria-label="controls">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <rect x="2" y="6" width="20" height="12" rx="6"/>
        <path d="M6 12h4M8 10v4"/>
        <circle cx="15.5" cy="10.5" r="1" fill="currentColor"/>
        <circle cx="17.5" cy="13.5" r="1" fill="currentColor"/>
      </svg>
    </button>

    <!-- Optical Aperture (f/1.4 - f/16 Bokeh DoF) Pill: Click or Scroll / Q & E -->
    <button id="btn-cycle-aperture" class="icon-pill active-gold" aria-label="aperture">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="10"/>
        <line x1="14.31" y1="8" x2="20.05" y2="17.94"/>
        <line x1="9.69" y1="8" x2="21.17" y2="8"/>
        <line x1="7.38" y1="12" x2="13.12" y2="2.06"/>
        <line x1="9.69" y1="16" x2="3.95" y2="6.06"/>
        <line x1="14.31" y1="16" x2="2.83" y2="16"/>
        <line x1="16.62" y1="12" x2="10.88" y2="21.94"/>
      </svg>
      <span id="hud-aperture-val">2.8</span>
    </button>

    <!-- Speedlight Flash Toggle -->
    <button id="btn-toggle-flash" class="icon-pill active-gold" aria-label="flash">
      <svg width="19" height="19" viewBox="0 0 24 24" fill="currentColor">
        <path d="M13 2L4 14h7l-1 8 9-12h-7l1-8z"/>
      </svg>
    </button>

    <!-- Sound Mute Toggle -->
    <button id="btn-toggle-sound" class="icon-pill active-gold" aria-label="sound">
      <svg id="icon-sound-on" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <path d="M15.54 8.46a5 5 0 0 1 0 7.07M19.07 4.93a10 10 0 0 1 0 14.14"/>
      </svg>
      <svg id="icon-sound-off" class="hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/>
        <line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>
      </svg>
    </button>

    <!-- Photo Album Button -->
    <button id="btn-open-album" class="icon-pill" aria-label="album">
      <div id="album-thumb-preview"></div>
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" style="position:relative;z-index:1">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="8.5" cy="9.5" r="1.5"/>
        <polyline points="21 15 16 10 5 20"/>
      </svg>
      <span id="album-count">0</span>
    </button>
  </div>

  <!-- Translucent Mobile / On-Screen Touch Controls -->
  <div id="touch-controls" class="hidden">
    <div id="touch-joystick-zone">
      <div id="touch-joystick-knob"></div>
    </div>

    <div class="touch-right-cluster">
      <!-- Vertical Aperture Ring Slider (Top = f/1.4 Max Bokeh, Bottom = f/16 Deep Sharp) -->
      <div id="touch-aperture-track">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2">
          <circle cx="12" cy="12" r="9"/>
        </svg>
        <div id="touch-aperture-thumb"></div>
        <svg width="12" height="12" viewBox="0 0 24 24" fill="currentColor">
          <circle cx="12" cy="12" r="4"/>
        </svg>
      </div>

      <!-- Vertical Optical Focal Length Zoom Slider (Top = 135mm, Bottom = 24mm) -->
      <div id="touch-zoom-track">
        <span>+</span>
        <div id="touch-zoom-thumb"></div>
        <span>−</span>
      </div>

      <div class="touch-action-col">
        <!-- Stand / Crouch / Sit Posture Toggle -->
        <button id="btn-touch-crouch" class="touch-btn" aria-label="posture">
          <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="12" cy="5" r="2"/>
            <path d="M9 20l3-5 3 5M12 7v6l-3 2"/>
          </svg>
        </button>

        <!-- Eye to Viewfinder Toggle -->
        <button id="btn-touch-aim" class="touch-btn" aria-label="viewfinder">
          <svg width="23" height="23" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7-11-7-11-7z"/>
            <circle cx="12" cy="12" r="3"/>
          </svg>
        </button>

        <!-- Shutter Trigger -->
        <button id="btn-touch-shutter" class="touch-btn" aria-label="shutter"></button>
      </div>
    </div>
  </div>

  <!-- Pure-Icon Photo Album Modal -->
  <div id="album-modal" class="hidden">
    <div class="album-topbar">
      <div class="album-brand-icon">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/>
          <circle cx="12" cy="13" r="4"/>
        </svg>
      </div>
      <button id="btn-close-album" class="icon-pill" aria-label="close">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
          <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
        </svg>
      </button>
    </div>

    <div id="album-grid"></div>
    <div id="album-empty-icon" class="hidden">
      <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.2">
        <rect x="3" y="4" width="18" height="16" rx="2"/>
        <circle cx="12" cy="12" r="3.5"/>
      </svg>
    </div>

    <!-- Lightbox Viewer with Share / Copy / Download / Delete Pure Icons -->
    <div id="album-lightbox" class="hidden">
      <div class="lightbox-top">
        <span id="lightbox-exif">50 · 2.8</span>
        <button id="btn-close-lightbox" class="icon-pill" aria-label="back">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">
            <line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>
          </svg>
        </button>
      </div>

      <div class="lightbox-stage">
        <button id="btn-prev-photo" class="nav-arrow" aria-label="prev">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="15 18 9 12 15 6"/></svg>
        </button>
        <img id="lightbox-img" alt="" />
        <button id="btn-next-photo" class="nav-arrow" aria-label="next">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><polyline points="9 18 15 12 9 6"/></svg>
        </button>
      </div>

      <div class="lightbox-actions">
        <!-- Share (Mobile Native Share Sheet / AirDrop / WeChat) -->
        <button id="btn-share-photo" class="icon-pill" aria-label="share">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/>
            <line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/>
          </svg>
        </button>

        <!-- Copy PNG to Clipboard -->
        <button id="btn-copy-photo" class="icon-pill" aria-label="copy">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"/>
            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
          </svg>
        </button>

        <!-- Download PNG -->
        <button id="btn-download-photo" class="icon-pill" aria-label="download">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </button>

        <!-- Delete Photo -->
        <button id="btn-delete-photo" class="icon-pill danger" aria-label="delete">
          <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="3 6 5 6 21 6"/>
            <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
          </svg>
        </button>
      </div>
    </div>
  </div>

  <script src="./dist/app.bundle.js?v=4"></script>
</body>
</html>
